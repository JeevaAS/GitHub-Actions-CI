name: .NET CI DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Packages
        run: |
          cd Enterprise.Web
          dotnet restore

      - name: Build Application
        run: |
          cd Enterprise.Web
          dotnet build --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Unit Tests
        run: |
          cd Enterprise.Web
          dotnet test --configuration Release

  sonar:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GitHub-Actions-CI
            -Dsonar.organization=jeevaas
            -Dsonar.sources=Enterprise.Web

  sbom:
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          mkdir -p sbom

      - name: Upload SBOM Folder
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom

  docker:
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: List Docker Images
        run: docker images

  publish:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Application
        run: |
          cd Enterprise.Web
          dotnet publish -c Release -o ../publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: publish