name: .NET CI DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  prerequisites:
    name: Pipeline Prerequisites
    runs-on: ubuntu-latest

    outputs:
      severity: ${{ steps.config.outputs.severity }}

    steps:
      - name: Set Scan Configuration
        id: config
        run: |
          echo "severity=HIGH,CRITICAL" >> $GITHUB_OUTPUT

      - name: Display Configuration
        run: |
          echo "======================================="
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Build No   : ${{ github.run_number }}"
          echo "Commit ID  : ${GITHUB_SHA::7}"
          echo "Severity   : HIGH,CRITICAL"
          echo "======================================="

  build-test-publish:
    name: Build Test Publish Application
    runs-on: ubuntu-latest
    needs: prerequisites

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: |
          cd Enterprise.Web
          dotnet restore

      - name: Execute Unit Tests
        run: |
          cd Enterprise.Web
          dotnet test --configuration Release --no-restore

      - name: Publish Application
        run: |
          cd Enterprise.Web
          dotnet publish -c Release --no-restore -o ../publish

      - name: Generate Build Information
        run: |
          echo "Application: Enterprise-Web" > publish/build-info.txt
          echo "Version: ${{ github.run_number }}" >> publish/build-info.txt
          echo "Commit ID: ${GITHUB_SHA::7}" >> publish/build-info.txt
          echo "Generated: $(date -u)" >> publish/build-info.txt

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: publish/

  sast-analysis:
    name: SonarCloud SAST Analysis
    runs-on: ubuntu-latest
    needs: build-test-publish

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Security Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GitHub-Actions-CI
            -Dsonar.organization=jeevaas
            -Dsonar.sources=Enterprise.Web

  dependency-analysis:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: sast-analysis

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Enterprise-Web
          path: .
          format: HTML

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: OWASP-Dependency-Check-Report
          path: reports
        continue-on-error: true

  sbom-generation:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: dependency-analysis

    steps:
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          echo "Application: Enterprise-Web" > sbom/sbom.txt
          echo "Version: ${{ github.run_number }}" >> sbom/sbom.txt
          echo "Commit ID: ${GITHUB_SHA::7}" >> sbom/sbom.txt
          echo "Generated: $(date -u)" >> sbom/sbom.txt

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloneDX-SBOM-v${{ github.run_number }}
          path: sbom/

  container-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: sbom-generation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: publish

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile .

      - name: Save Docker Image
        run: |
          docker save \
            enterprise-web:${{ github.run_number }} \
            -o image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  container-security-scan:
    name: Trivy Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - container-build
      - prerequisites

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-web:${{ github.run_number }}
          format: table
          severity: ${{ needs.prerequisites.outputs.severity }}
          exit-code: 0

      - name: Generate Trivy SARIF Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-web:${{ github.run_number }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ needs.prerequisites.outputs.severity }}

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: Trivy-Report
          path: trivy-results.sarif

  container-registry:
    name: Publish Container To GHCR
    runs-on: ubuntu-latest
    needs: container-security-scan

    steps:
      - name: Convert Repository Owner To Lowercase
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Login To GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Image
        run: |
          docker tag \
            enterprise-web:${{ github.run_number }} \
            ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:${{ github.run_number }}

          docker tag \
            enterprise-web:${{ github.run_number }} \
            ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:latest

      - name: Push Version Image
        run: |
          docker push \
            ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:${{ github.run_number }}

      - name: Push Latest Image
        run: |
          docker push \
            ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:latest