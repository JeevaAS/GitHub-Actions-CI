name: .NET CI DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  source-build:
    name: Build & Compile Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: |
          cd Enterprise.Web
          dotnet restore

      - name: Build Application
        run: |
          cd Enterprise.Web
          dotnet build --configuration Release --no-restore

  unit-testing:
    name: Execute Unit Tests
    runs-on: ubuntu-latest
    needs: source-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Execute Test Suite
        run: |
          cd Enterprise.Web
          dotnet test --configuration Release

  sast-analysis:
    name: SonarCloud SAST Analysis
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Security Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GitHub-Actions-CI
            -Dsonar.organization=jeevaas
            -Dsonar.sources=Enterprise.Web

  sbom-generation:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: sast-analysis

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install CycloneDX Tool
        run: |
          dotnet tool install --global CycloneDX

      - name: Create SBOM Folder
        run: |
          mkdir -p sbom

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloneDX-SBOM
          path: sbom

  container-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: sbom-generation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Verify Docker Image
        run: docker images

  container-security-scan:
    name: Trivy Container Security Scan
    runs-on: ubuntu-latest
    needs: container-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-web:${{ github.run_number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  container-registry:
    name: Publish Container To GHCR
    runs-on: ubuntu-latest
    needs: container-security-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Convert Repository Owner To Lowercase
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login To GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Tag Container Image
        run: |
          docker build \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Push Container Image
        run: |
          docker push \
            ghcr.io/${{ steps.owner.outputs.owner }}/enterprise-web:${{ github.run_number }}

  application-publish:
    name: Publish Application Artifact
    runs-on: ubuntu-latest
    needs: container-registry

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Application
        run: |
          cd Enterprise.Web
          dotnet publish -c Release -o ../publish

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: Enterprise-Web-Package
          path: publish