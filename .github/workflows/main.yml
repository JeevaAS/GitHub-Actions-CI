name: .NET CI DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Packages
        run: |
          cd Enterprise.Web
          dotnet restore

      - name: Build Application
        run: |
          cd Enterprise.Web
          dotnet build --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Unit Tests
        run: |
          cd Enterprise.Web
          dotnet test --configuration Release

  sonar:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GitHub-Actions-CI
            -Dsonar.organization=jeevaas
            -Dsonar.sources=Enterprise.Web

  sbom:
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install CycloneDX
        run: |
          dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          mkdir -p sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom

  docker:
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Verify Docker Image
        run: docker images

  trivy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-web:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  ghcr:
    runs-on: ubuntu-latest
    needs: trivy

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Tag Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/enterprise-web:${{ github.run_number }} \
            -f Enterprise.Web/Dockerfile \
            Enterprise.Web

      - name: Push Image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/enterprise-web:${{ github.run_number }}

  publish:
    runs-on: ubuntu-latest
    needs: ghcr

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Application
        run: |
          cd Enterprise.Web
          dotnet publish -c Release -o ../publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: publish